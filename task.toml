name = "dpo-pipeline-debug"
description = "Diagnose and repair a silent preference corruption bug in a synthetic DPO pipeline."

[metadata]
category = "benchmark"
stack = ["python", "jsonl"]

[verifier]
environment_mode = "separate"

[verifier.environment]
os = "linux"

[[artifacts]]
source = "/solution/src/dedup.py"
destination = "solution/src/dedup.py"

[[artifacts]]
source = "/solution/src/format.py"
destination = "solution/src/format.py"

[[artifacts]]
source = "/solution/data/deduped_preferences.jsonl"
destination = "solution/data/deduped_preferences.jsonl"

[[artifacts]]
source = "/solution/data/final_preferences.jsonl"
destination = "solution/data/final_preferences.jsonl"

[[artifacts]]
source = "/solution/REPORT.md"
destination = "solution/REPORT.md"